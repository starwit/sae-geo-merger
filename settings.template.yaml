log_level: DEBUG
prometheus_port: 8000
redis:
  host: redis
  port: 6379
  input_stream_prefix: geomapper
  output_stream_prefix: geomerger
merging_config:
  max_distance_m: 2
  target_mps: 10
  mapping_expiration_s: 30
  input_stream_ids: 
    - north
    - west
    - south
    - east
  output_stream_id: merged